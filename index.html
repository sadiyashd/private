<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Comics">
<title>USB Comic Reader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="covers/catalog.js"></script>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #0b0b0d; color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden;
  }
  #library-screen { height: 100%; display: flex; flex-direction: column; }
  #library-header {
    padding: 20px 20px 12px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #222;
  }
  #library-header h1 { font-size: 22px; font-weight: 700; margin: 0; }
  .icon-btn {
    background: rgba(255,255,255,0.08); color: white; border: none; border-radius: 10px;
    width: 40px; height: 40px; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  /* Lucide SVGs: https://lucide.dev — license in third-party/lucide/LICENSE. */
  #library-header .lucide { width: 22px; height: 22px; flex-shrink: 0; pointer-events: none; }
  #library-empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 20px; text-align: center; color: #888;
  }
  #library-empty p { max-width: 300px; font-size: 14px; margin: 0; }
  #library-grid {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px; padding: 16px 20px 40px;
  }
  @media (orientation: landscape) {
    #library-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    #library-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .comic-card { cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
  .comic-card:focus { outline: none; }
  .comic-card:focus-visible { outline: none; }
  .comic-cover {
    width: 100%; aspect-ratio: 2/3; border-radius: 12px; background: #1c1c1f;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .comic-cover:has(img) { aspect-ratio: auto; }
  .comic-cover img { display: block; width: 100%; height: auto; border-radius: 12px; }
  .comic-cover .spinner-dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
  .comic-cover.needs-reselect { opacity: 0.55; }
  .comic-cover .reselect-badge {
    position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.75);
    border-radius: 10px; padding: 3px 7px; font-size: 10px; color: #ccc;
  }
  .comic-title {
    font-size: 12px; color: #ccc; margin-top: 6px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .progress-track { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .progress-track-fill { height: 100%; background: #2b6fff; }
  .comic-card.selectable .comic-cover { opacity: 0.85; }
  .selection-checkmark {
    display: none; position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 50%;
    background: rgba(0,0,0,0.6); border: 2px solid #fff; align-items: center; justify-content: center;
    color: transparent; font-size: 13px; font-weight: 700;
  }
  #library-grid.selecting .selection-checkmark { display: flex; }
  .comic-card.selected .selection-checkmark { background: #2b6fff; color: white; }
  #undo-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1c1c1f; color: #eee; padding: 12px 16px; border-radius: 12px;
    display: none; align-items: center; gap: 14px; font-size: 14px; z-index: 50;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #undo-toast.visible { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
  #undo-toast button {
    background: none; border: none; color: #4d8dff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #status { color: #888; font-size: 13px; text-align: center; padding: 8px 20px; min-height: 18px; }

  #reader-screen {
    display: none; height: 100%; position: relative;
    align-items: center; justify-content: center; background: #000;
  }
  #page-container {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%; gap: 12px;
    padding-bottom: max(28px, env(safe-area-inset-bottom));
  }
  #page-image-left, #page-image-right {
    max-width: 100%; max-height: 100%; object-fit: contain; touch-action: manipulation;
  }
  #page-container img { display: block; }
  #tap-left, #tap-right { position: absolute; top: 0; bottom: 0; width: 33%; z-index: 5; }
  #tap-left { left: 0; } #tap-right { right: 0; }
  #tap-center { position: absolute; top: 0; bottom: 0; left: 33%; right: 33%; z-index: 5; }
  #nav-menu-overlay {
    display: none; position: absolute; inset: 0; z-index: 15;
    background: rgba(0,0,0,0.4);
    align-items: center; justify-content: center;
  }
  #nav-menu-overlay.open { display: flex; }
  #nav-menu-panel {
    background: rgba(24,24,26,0.97); border-radius: 18px; padding: 8px;
    min-width: 220px; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  }
  #nav-menu-panel button {
    background: none; border: none; color: white; text-align: left;
    padding: 14px 16px; font-size: 15px; border-radius: 10px; width: 100%;
    display: flex; align-items: center; gap: 12px; cursor: pointer;
  }
  #nav-menu-panel button .icon { font-size: 18px; width: 22px; text-align: center; }
  #nav-menu-panel button.active { background: #2b6fff; }
  #nav-menu-panel button:active { background: rgba(255,255,255,0.1); }
  #stretch-panel {
    display: none; padding: 12px 14px 8px; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 4px;
  }
  #stretch-panel.open { display: block; }
  #stretch-panel label {
    display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; margin-top: 10px;
  }
  #stretch-panel label:first-child { margin-top: 0; }
  #stretch-panel input[type="range"] { width: 100%; }
  #stretch-reset-btn {
    background: rgba(255,255,255,0.08); border: none; color: white; width: 100%;
    padding: 8px; border-radius: 8px; font-size: 13px; margin-top: 10px; cursor: pointer;
  }
  #loading-spinner {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #888; font-size: 14px; z-index: 20; max-width: 80%; text-align: center;
    pointer-events: none; opacity: 0; transition: opacity 0.2s ease;
  }
  #loading-spinner.visible { opacity: 1; }
  input[type="file"] { display: none; }
  #gate-overlay {
    position: fixed; inset: 0; background: #0b0b0d; z-index: 100;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  }
  #gate-overlay h1 { color: #eee; font-size: 18px; font-weight: 600; margin: 0; }
  #gate-input {
    background: #1c1c1f; border: 1px solid #333; color: #fff; font-size: 18px;
    padding: 12px 16px; border-radius: 10px; width: 200px; text-align: center; letter-spacing: 4px;
  }
  #gate-submit {
    background: #2b6fff; color: white; border: none; border-radius: 10px;
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #gate-error { color: #e24b4a; font-size: 13px; min-height: 16px; }
  #selection-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
    background: rgba(24,24,26,0.97); padding: 14px 16px; padding-bottom: max(14px, env(safe-area-inset-bottom));
    display: none; align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
  }
  #selection-bar.open { display: flex; }
  #selection-count { color: #ccc; font-size: 14px; }
  #selection-bar-buttons { display: flex; gap: 8px; }
  #selection-cancel-btn {
    background: rgba(255,255,255,0.1); color: #ccc; border: none; border-radius: 10px;
    padding: 10px 16px; font-size: 14px; cursor: pointer;
  }
  #selection-delete-btn {
    background: #e24b4a; color: white; border: none; border-radius: 10px;
    padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #selection-delete-btn:disabled { opacity: 0.4; }

  #library-screen { overflow-y: auto; }
  #library-header { flex-wrap: wrap; gap: 10px; flex-shrink: 0; }
  #comic-search { margin: 12px 20px 8px; padding: 12px; border: 1px solid #444; border-radius: 10px; background: #18181c; color: white; font: inherit; }
  .comic-card[hidden] { display: none !important; }
  #library-grid { flex: none; overflow: visible; }
  #recent-section { padding: 0 20px 32px; }
  #recent-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px 12px; padding: 4px 0 16px; }
  @media (orientation: landscape) {
    #recent-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    #recent-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  #recent-empty { color: #aaa; }
  #library-header { position: sticky; top: 0; z-index: 20; background: #0b0b0d; }
  #library-home-btn[aria-pressed="true"], #library-recent-btn[aria-pressed="true"] { background: #34343d; }
  #recent-grid.selecting .selection-checkmark { display: flex; }
  .history-button { background: #25252b; color: white; border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  #done-btn { position: absolute; bottom: max(36px, env(safe-area-inset-bottom)); right: 20px; z-index: 12; background: #2b6fff; color: white; padding: 14px 22px; border: 0; border-radius: 12px; font-size: 17px; font-weight: 600; }
  #done-btn[hidden] { display: none; }
  #save-exit-btn { position: absolute; bottom: max(36px, env(safe-area-inset-bottom)); left: 20px; z-index: 12; background: #25252d; color: white; padding: 14px 18px; border: 1px solid #555; border-radius: 12px; font-size: 16px; cursor: pointer; }
  :root { --read-color: #269c68; --unread-color: #2b6fff; }
  .comic-card.is-read .progress-track-fill { background: var(--read-color); }
  #cover-preview { width: min(92vw, 760px); max-height: 94vh; max-height: 94dvh; padding: 18px; border: 1px solid #393940; border-radius: 18px; color: #eee; background: #141418; box-sizing: border-box; }
  #cover-preview[open] { display: flex; flex-direction: column; gap: 12px; }
  #cover-preview::backdrop { background: rgba(0,0,0,.85); }
  #preview-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-shrink: 0; }
  #preview-title { margin: 0; font-size: 20px; }
  #preview-frame { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; touch-action: pan-y; }
  #preview-image { display: block; border-radius: 12px; max-width: 100%; max-height: calc(90vh - 190px); max-height: calc(90dvh - 190px); object-fit: contain; }
  .preview-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 52px; border: 1px solid #777; border-radius: 12px; font-size: 36px; background: rgba(0,0,0,.7); color: white; cursor: pointer; }
  .preview-arrow:disabled { opacity: .25; cursor: default; }
  #preview-previous { left: 4px; }
  #preview-next { right: 4px; }
  #preview-status { margin: 0; min-height: 18px; text-align: center; font-size: 14px; color: #aaa; flex-shrink: 0; }
  #preview-read { flex-shrink: 0; background: var(--unread-color); border: 0; color: white; border-radius: 12px; padding: 14px; font-size: 18px; font-weight: 600; cursor: pointer; }
  #preview-read.is-read { background: var(--read-color); }
  #choose-comic-file { margin: 0 20px 12px; align-self: flex-start; }
  #choose-comic-file[hidden], #cache-notice[hidden] { display: none; }
  #cache-notice { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 80; display: flex; align-items: center; gap: 12px; width: min(90vw, 480px); background: #28282e; color: white; border: 1px solid #555; border-radius: 12px; padding: 14px; font-size: 14px; box-shadow: 0 4px 20px #0008; }
  #cache-notice-close { background: none; color: white; border: 0; padding: 8px; cursor: pointer; }
  #startup-dialog { width: min(90vw, 440px); box-sizing: border-box; padding: 24px; border: 1px solid #414148; border-radius: 16px; color: #eee; background: #18181d; }
  #startup-dialog::backdrop { background: rgba(0,0,0,.8); }
  #startup-dialog h2 { margin: 0 0 12px; }
  #startup-description { color: #bbb; line-height: 1.8; white-space: pre-line; }
  .startup-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  #startup-continue { background: #2b6fff; }
  #startup-message { margin: 12px 0 0; color: #f3b0ae; font-size: 14px; }
  #startup-message:empty { display: none; }
  #startup-dialog { max-height: 90vh; max-height: 90dvh; overflow-y: auto; }
</style>
</head>
<body>

<div id="gate-overlay">
  <h1>Enter access code</h1>
  <input type="password" id="gate-input" inputmode="numeric" maxlength="12" autocomplete="off">
  <button id="gate-submit">Unlock</button>
  <div id="gate-error"></div>
</div>

<div id="library-screen">
  <div id="library-header">
    <div style="display:flex;gap:12px;align-items:center;">
      <h1>Prom's Comics</h1>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button id="library-home-btn" class="icon-btn" aria-label="Home" title="Home" aria-pressed="true">
        <svg class="lucide lucide-house" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
  <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
</svg>
      </button>
      <button id="library-recent-btn" class="icon-btn" aria-label="Reading history" title="Reading history" aria-pressed="false">
        <svg class="lucide lucide-eye" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
  <circle cx="12" cy="12" r="3" />
</svg>
      </button>
      <button id="library-trash-btn" class="icon-btn" aria-label="Delete comics" title="Delete comics"><svg class="lucide lucide-trash" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M10 11v6" />
  <path d="M14 11v6" />
  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
  <path d="M3 6h18" />
  <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
</svg></button>
      <button id="library-reload-btn" class="icon-btn" aria-label="Reload reader" title="Reload reader"><svg class="lucide lucide-rotate-cw" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
  <path d="M21 3v5h-5" />
</svg></button>
      <button id="choose-btn" class="icon-btn" aria-label="Choose comic files" title="Choose comic files"><svg class="lucide lucide-plus" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M5 12h14" />
  <path d="M12 5v14" />
</svg></button>
    </div>
    <input type="file" id="file-input" accept="application/octet-stream,.cbz,.cbr,.zip,.rar" multiple>
  </div>
  <input id="comic-search" type="search" placeholder="Find an issue…" aria-label="Find a comic by title or issue number">
  <div id="status" role="status" aria-live="polite"></div>
  <button id="choose-comic-file" class="history-button" hidden>Choose comic file</button>
  <div id="library-empty">
    <p>Select .cbz and .cbr files straight from your USB drive. Opened comics are kept on this iPad for two weeks after you last open them.</p>
    <label id="choose-btn-2" for="file-input" style="background:#2b6fff;color:white;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;">Choose Comics</label>
  </div>
  <div id="library-grid" style="display:none;"></div>
  <section id="recent-section" hidden>
    <h2>Reading history</h2>
    <p id="recent-empty" hidden>No reading history yet.</p>
    <div id="recent-grid"></div>
  </section>
  <div id="undo-toast">
    <span id="undo-toast-text">Comic removed</span>
    <button id="undo-toast-btn">Undo</button>
  </div>
</div>

<dialog id="startup-dialog" aria-labelledby="startup-title" aria-describedby="startup-description">
  <h2 id="startup-title">Welcome back</h2>
  <p id="startup-description"></p>
  <div class="startup-actions">
    <button id="startup-continue" class="history-button" autofocus>Continue</button>
    <button id="startup-restore" class="history-button">Restore from backup</button>
  </div>
  <input id="startup-history-input" type="file" accept=".json,application/json" hidden>
  <p id="startup-message" role="status" aria-live="polite"></p>
</dialog>

<dialog id="cover-preview" aria-labelledby="preview-title">
  <div id="preview-heading">
    <h2 id="preview-title"></h2>
    <button id="preview-close" class="icon-btn" aria-label="Close cover preview">✕</button>
  </div>
  <div id="preview-frame">
    <button id="preview-previous" class="preview-arrow" aria-label="Previous cover">‹</button>
    <img id="preview-image" alt="" draggable="false">
    <button id="preview-next" class="preview-arrow" aria-label="Next cover">›</button>
  </div>
  <p id="preview-status" aria-live="polite"></p>
  <button id="preview-read">Read</button>
</dialog>

<div id="cache-notice" role="status" hidden>
  <span id="cache-notice-text"></span>
  <button id="cache-notice-close" aria-label="Dismiss storage message">✕</button>
</div>

<div id="selection-bar">
  <span id="selection-count">0 selected</span>
  <div id="selection-bar-buttons">
    <button id="selection-cancel-btn">Cancel</button>
    <button id="selection-delete-btn" disabled>Delete</button>
  </div>
</div>

<div id="reader-screen">
  <div id="nav-menu-overlay">
    <div id="nav-menu-panel">
      <button id="menu-library-btn"><span class="icon">🏠</span> Library</button>
      <button id="menu-spread-btn"><span class="icon">📖</span> Two-Page Spread</button>
      <button id="menu-stretch-btn"><span class="icon">↔️</span> Fix Stretching</button>
      <button id="menu-reload-btn"><span class="icon">🔄</span> Reload App</button>
      <div id="stretch-panel">
        <label>Horizontal <span id="stretch-x-value">100%</span></label>
        <input type="range" id="stretch-x-slider" min="70" max="130" value="100">
        <label>Vertical <span id="stretch-y-value">100%</span></label>
        <input type="range" id="stretch-y-slider" min="70" max="130" value="100">
        <button id="stretch-reset-btn">Reset for this comic</button>
      </div>
    </div>
  </div>
  <button id="save-exit-btn">Save &amp; Exit</button>
  <button id="done-btn" hidden>Done</button>
  <div id="loading-spinner">Loading page…</div>
  <div id="page-container">
    <img id="page-image-left" style="display:none;">
    <img id="page-image-right" style="display:none;">
  </div>
  <div id="tap-left"></div>
  <div id="tap-center"></div>
  <div id="tap-right"></div>
</div>

<script>
// Salted verifier only; this client-side screen is not server authentication.
const ACCESS_CODE_HASH = 'f9c30904ca58e9a91362658b2eaddbe8524f241b1b4e44b3c43d30b51fa42efb';
const ACCESS_CODE_SALT = '782708fbaa262a2ade2ef34bd8f74c21';
const ACCESS_CODE_ITERATIONS = 210000;
const GATE_UNLOCK_VERSION = 'pbkdf2-v1';
const GATE_UNLOCK_KEY = 'usbComicReaderUnlocked';

const gateOverlay = document.getElementById('gate-overlay');
const gateInput = document.getElementById('gate-input');
const gateSubmit = document.getElementById('gate-submit');
const gateError = document.getElementById('gate-error');

function unlockGate() {
  gateOverlay.style.display = 'none';
  localStorage.setItem(GATE_UNLOCK_KEY, GATE_UNLOCK_VERSION);
  gateInput.value = '';
  gateError.textContent = '';
  bootApp();
}

let gateChecking = false;
async function checkGateCode() {
  if (gateChecking) return;
  gateChecking = true;
  gateSubmit.disabled = true;
  gateError.textContent = '';
  try {
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(gateInput.value), 'PBKDF2', false, ['deriveBits']);
    const salt = Uint8Array.from(ACCESS_CODE_SALT.match(/../g), byte => parseInt(byte, 16));
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: ACCESS_CODE_ITERATIONS, hash: 'SHA-256' }, key, 256);
    const hash = Array.from(new Uint8Array(bits), byte => byte.toString(16).padStart(2, '0')).join('');
    if (hash === ACCESS_CODE_HASH) {
      unlockGate();
    } else {
      gateError.textContent = 'Wrong code, try again.';
      gateInput.value = '';
      gateInput.focus();
    }
  } catch {
    gateError.textContent = 'Could not check the code. Open the reader using its HTTPS website address and try again.';
  } finally {
    gateChecking = false;
    gateSubmit.disabled = false;
  }
}

});

const PROGRESS_KEY = 'usbComicReaderProgress';
const SPREAD_MODE_KEY = 'usbComicReaderSpreadMode';
const IMAGE_EXT = /\.(jpe?g|png|gif|webp|bmp)$/i;

function isValidImageFile(filePath) {
  if (!filePath) return false;
  const fileName = filePath.split('/').pop();
  return !fileName.startsWith('._') && !filePath.includes('__MACOSX') && IMAGE_EXT.test(fileName);
}

function parseComicTitle(rawTitle) {
  const cleaned = rawTitle.replace(/[._]+/g, ' ').trim();
  const wordMatch = cleaned.match(/^[A-Za-z][A-Za-z''-]*/);
  const word = wordMatch ? wordMatch[0] : (cleaned.split(' ')[0] || cleaned);

  const yearMatch = cleaned.match(/\b(19|20)\d{2}\b/);
  const year = yearMatch ? yearMatch[0] : null;

  let issue = null;
  const numberMatches = cleaned.match(/\d+/g) || [];
  for (const num of numberMatches) {
    if (num !== year) { issue = num; break; }
  }

  const parts = [word];
  if (issue) parts.push(issue);
  if (year) parts.push(`(${year})`);
  return parts.join(' ').trim() || cleaned;
}

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; } catch { return {}; }
}
function saveProgress(map) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(map)); }
// Match this series only; Archie & Friends and other titles keep their own file keys.
function archieIssue(name) {
  const match = String(name).match(/^archie[\s._-]+#?0*(\d+)(?=$|[\s._(\[-])/i);
  return match ? Number(match[1]) : null;
}
function canonicalComicKey(key, title = '') {
  if (/^archie:\d+$/.test(key)) return key;
  const issue = archieIssue(key) ?? archieIssue(title);
  return issue === null ? key : `archie:${issue}`;
}
function comicKey(file) { return canonicalComicKey(`${file.name}_${file.size}`); }

function loadSpreadMode() { return localStorage.getItem(SPREAD_MODE_KEY) === 'true'; }
function saveSpreadMode(val) { localStorage.setItem(SPREAD_MODE_KEY, val ? 'true' : 'false'); }

let dbPromise = null;
function getDB() {
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open('usbComicReaderDB', 2);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('covers')) db.createObjectStore('covers', { keyPath: 'key' });
        if (!db.objectStoreNames.contains('comics')) db.createObjectStore('comics', { keyPath: 'key' });
        if (!db.objectStoreNames.contains('comicCacheMetadata')) {
          const metadata = db.createObjectStore('comicCacheMetadata', { keyPath: 'key' });
          metadata.createIndex('expiresAt', 'expiresAt');
        }
      };
      let blocked = false;
      req.onblocked = () => {
        blocked = true;
        reject(new Error('Close other Comic Reader tabs and reload to enable temporary comic storage.'));
      };
      req.onsuccess = () => {
        if (blocked) { req.result.close(); dbPromise = null; return; }
        req.result.onversionchange = () => { req.result.close(); dbPromise = null; };
        resolve(req.result);
      };
      req.onerror = () => { dbPromise = null; reject(req.error); };
    });
  }
  return dbPromise;
}
async function saveCoverToCache(key, title, blob, pageCount) {
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('covers', 'readwrite');
    tx.objectStore('covers').put({ key, title, blob, pageCount });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getAllCachedCovers() {
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('covers', 'readonly');
    const req = tx.objectStore('covers').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function renderCachedLibrary() {
  try {
    const cached = await getAllCachedCovers();
    const progress = loadProgress();
    for (const entry of cached) {
      const key = canonicalComicKey(entry.key, entry.title);
      if (hiddenCatalogKeys().includes(key)) continue;
      let card = cardsByKey[key];
      if (!card) {
        card = buildCard(parseComicTitle(entry.title), key);
        const cover = card.querySelector('.comic-cover');
        const img = document.createElement('img');
        const url = URL.createObjectURL(entry.blob);
        img.src = url;
        // Keep the cover URL alive so its full-size preview can be opened later.
        cover.replaceChildren(img);
        addCardSelectionMark(cover);
        card.addEventListener('click', () => onCardClick(key, card));
        cardsByKey[key] = card;
      }
      addProgressBar(card, key, entry.pageCount, progress);
    }
  } catch (error) {
    console.error('Could not read cover cache', error);
  }
  refreshLibrary();
}

function buildCard(title, key) {
  const card = document.createElement('div');
  card.className = 'comic-card';
  card.dataset.key = key;
  card.tabIndex = 0;
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', `Preview ${title}`);
  card.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); onCardClick(key, cardsByKey[key] || card); }
  });

  const cover = document.createElement('div');
  cover.className = 'comic-cover';
  const dot = document.createElement('div');
  dot.className = 'spinner-dot';
  cover.appendChild(dot);

  const checkmark = document.createElement('div');
  checkmark.className = 'selection-checkmark';
  checkmark.textContent = '✓';
  cover.appendChild(checkmark);

  const titleEl = document.createElement('div');
  titleEl.className = 'comic-title';
  titleEl.textContent = title;

  const track = document.createElement('div');
  track.className = 'progress-track';
  track.style.display = 'none';
  const trackFill = document.createElement('div');
  trackFill.className = 'progress-track-fill';
  trackFill.style.width = '0%';
  track.appendChild(trackFill);

  card.appendChild(cover);
  card.appendChild(titleEl);
  card.appendChild(track);

  return card;
}

function addProgressBar(card, key, pageCount, progress) {
  card.dataset.pageCount = pageCount;
  if (!Number.isSafeInteger(pageCount) || pageCount < 1) return;
  const history = loadHistory();
  history[key] = { ...history[key], title: card.querySelector('.comic-title').textContent, pageCount };
  if (pageCount > 0 && progress[key] >= pageCount - 1) history[key].completed = true;
  saveHistory(history);
  queueMicrotask(refreshLibrary);
  const track = card.querySelector('.progress-track');
  if (!track) return;
  card.classList.toggle('is-read', !!history[key]?.completed);
  if (!history[key]?.completed && (progress[key] === undefined || !pageCount || pageCount <= 1)) {
    track.style.display = 'none';
    return;
  }
  const pct = history[key]?.completed ? 100 : Math.min(100, Math.round(((progress[key] + 1) / pageCount) * 100));
  track.querySelector('.progress-track-fill').style.width = pct + '%';
  track.style.display = 'block';
}

let lastDeleted = null;
let undoTimer = null;

async function collectDeletionRecord(key) {
  const card = cardsByKey[key];
  if (!card) return null;

  let coverEntry = null;
  try {
    const all = await getAllCachedCovers();
    coverEntry = all.find(c => canonicalComicKey(c.key, c.title) === key) || null;
  } catch (err) { /* ignore */ }

  const progress = loadProgress();
  const progressValue = progress[key];
  const liveFileIndex = libraryFiles.findIndex(f => comicKey(f) === key);
  const liveFile = liveFileIndex !== -1 ? libraryFiles[liveFileIndex] : null;

  const history = loadHistory();
  const historyEntry = history[key];
  delete history[key];
  saveHistory(history);
  const record = { key, coverEntry, progressValue, liveFile, historyEntry };
  if (isCatalogKey(key)) setCatalogHidden(key, true);

  const coverURL = card.querySelector('.comic-cover img')?.src;
  if (coverURL?.startsWith('blob:')) URL.revokeObjectURL(coverURL);
  card.remove();
  delete cardsByKey[key];
  if (liveFileIndex !== -1) libraryFiles.splice(liveFileIndex, 1);
  if (progressValue !== undefined) {
    delete progress[key];
    saveProgress(progress);
  }
  try {
    const db = await getDB();
    const entries = await getAllCachedCovers();
    const tx = db.transaction('covers', 'readwrite');
    for (const entry of entries) {
      if (canonicalComicKey(entry.key, entry.title) === key) tx.objectStore('covers').delete(entry.key);
    }
  } catch (err) { console.error('Could not remove cached cover', err); }

  return record;
}

async function deleteComic(key) {
  await deleteComics([key]);
}

async function deleteComics(keys) {
  const records = [];
  for (const key of keys) {
    const record = await collectDeletionRecord(key);
    if (record) records.push(record);
  }
  if (records.length === 0) return;

  lastDeleted = records;

  if (libraryGrid.children.length === 0) {
    libraryGrid.style.display = 'none';
    libraryEmpty.style.display = 'flex';
  }

  refreshLibrary();
  showUndoToast(records.length);
}

function showUndoToast(count) {
  document.getElementById('undo-toast-text').textContent =
    count > 1 ? `${count} comics removed` : 'Comic removed';
  clearTimeout(undoTimer);
  undoToast.classList.add('visible');
  undoTimer = setTimeout(() => {
    undoToast.classList.remove('visible');
    lastDeleted = null;
  }, 6000);
}

async function restoreComic(record) {
  const { key, coverEntry, progressValue, liveFile } = record;
  if (isCatalogKey(key)) setCatalogHidden(key, false);
  if (record.historyEntry) {
    const history = loadHistory();
    history[key] = record.historyEntry;
    saveHistory(history);
  }

  if (liveFile) libraryFiles.push(liveFile);
  if (progressValue !== undefined) {
    const progress = loadProgress();
    progress[key] = progressValue;
    saveProgress(progress);
  }

  if (isCatalogKey(key) || !coverEntry) { renderCatalog(); renderHistoryCards(); return; }

  try {
    await saveCoverToCache(coverEntry.key, coverEntry.title, coverEntry.blob, coverEntry.pageCount);
  } catch (err) { console.error('Could not restore cached cover', err); }

  libraryEmpty.style.display = 'none';
  libraryGrid.style.display = libraryView === 'home' ? 'grid' : 'none';

  const card = buildCard(parseComicTitle(coverEntry.title), key);
  const cover = card.querySelector('.comic-cover');
  cover.innerHTML = '';
  const img = document.createElement('img');
  const url = URL.createObjectURL(coverEntry.blob);
  img.src = url;
  // Cover previews reuse this URL for the lifetime of the library card.
  cover.appendChild(img);
  addCardSelectionMark(cover);
  const progress = loadProgress();
  addProgressBar(card, key, coverEntry.pageCount, progress);

  card.addEventListener('click', () => onCardClick(key, card));
  libraryGrid.appendChild(card);
  cardsByKey[key] = card;
}

async function undoDelete() {
  if (!lastDeleted) return;
  const records = lastDeleted;

  clearTimeout(undoTimer);
  undoToast.classList.remove('visible');
  lastDeleted = null;

  for (const record of records) {
    await restoreComic(record);
  }
}

async function loadCoverThumbnail(file, card, coverEl, progress, key) {
  try {
    const opened = await openArchive(file);
    if (opened.pageNames.length === 0) return;

    const blob = await getPageBlobFromArchive(opened, opened.pageNames[0]);
    const url = URL.createObjectURL(blob);
    const img = document.createElement('img');
    img.src = url;
    // Cover previews reuse this URL for the lifetime of the library card.
    if (!isCatalogKey(key)) { coverEl.replaceChildren(img); addCardSelectionMark(coverEl); }
    else URL.revokeObjectURL(url);
    addProgressBar(card, key, opened.pageNames.length, progress);

    file.__cachedArchive = opened;

    saveCoverToCache(key, file.name.replace(/\.(cbz|cbr|zip|rar)$/i, ''), blob, opened.pageNames.length)
      .catch(err => console.error('Could not cache cover', err));
  } catch (err) {
    console.error('Cover failed for', file.name, err);
    if (isCatalogKey(key)) return;
    coverEl.innerHTML = '<span style="font-size:11px;color:#666;padding:6px;text-align:center;">Couldn\'t read</span>';
  }
}

let unrarModulePromise = null;
function loadUnrarModule() {
  if (!unrarModulePromise) {
    unrarModulePromise = import('https://cdn.jsdelivr.net/npm/node-unrar-js@2.0.2/+esm');
  }
  return unrarModulePromise;
}

async function openArchive(file) {
  if (file.__cachedArchive) return file.__cachedArchive;

  const lowerName = file.name.toLowerCase();
  const isRar = lowerName.endsWith('.cbr') || lowerName.endsWith('.rar');

  let result;
  if (isRar) {
    result = await openRar(file);
  } else {
    try {
      result = await openZip(file);
    } catch {
      result = await openRar(file);
    }
  }
  return result;
}

async function openZip(file) {
  const zip = await JSZip.loadAsync(file);
  const pageNames = Object.values(zip.files)
    .filter(f => !f.dir && isValidImageFile(f.name))
    .map(f => f.name)
    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  return { type: 'zip', zip, pageNames };
}

let wasmBinaryPromise = null;
function loadWasmBinary() {
  if (!wasmBinaryPromise) {
    wasmBinaryPromise = fetch('https://cdn.jsdelivr.net/npm/node-unrar-js@2.0.2/esm/js/unrar.wasm')
      .then(resp => resp.arrayBuffer());
  }
  return wasmBinaryPromise;
}

async function openRar(file) {
  const unrarModule = await loadUnrarModule();
  const wasmBinary = await loadWasmBinary();
  // Read the archive's bytes into memory once — cheap and safe to keep
  // around. We do NOT keep the rarExtractor object itself alive after
  // this — creating a fresh extractor per single read is what avoids
  // cross-comic corruption (see getPageBlobFromArchive).
  const buf = await file.arrayBuffer();
  const listExtractor = await unrarModule.createExtractorFromData({ data: buf, wasmBinary });
  const list = listExtractor.getFileList();
  const headers = [...list.fileHeaders];
  const pageNames = headers
    .filter(h => !h.flags.directory && isValidImageFile(h.name))
    .map(h => h.name)
    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  return { type: 'rar', buf, rarQueue: Promise.resolve(), pageNames };
}

function getPageBlobFromArchive(archive, name) {
  if (archive.type === 'zip') {
    return archive.zip.files[name].async('blob');
  } else {
    // Fresh, throwaway extractor for every single page — never reused,
    // never kept alive after this call. Keeping extractor objects around
    // (even from different comics) seems to share underlying WASM memory
    // and corrupt each other; building one fresh each time avoids that
    // entirely. Also uses unfiltered extract() + manual name matching,
    // since the filtered "files: [name]" option has its own separate
    // reliability problems.
    const run = async () => {
      const unrarModule = await loadUnrarModule();
      const wasmBinary = await loadWasmBinary();
      const rarExtractor = await unrarModule.createExtractorFromData({ data: archive.buf, wasmBinary });

      const extracted = rarExtractor.extract();
      const files = [...extracted.files];
      const match = files.find(f => f.fileHeader && f.fileHeader.name === name);
      if (!match || !match.extraction) {
        throw new Error(`Could not read page "${name}" from this .cbr.`);
      }
      const data = match.extraction;
      const ext = name.split('.').pop().toLowerCase();
      const mime = ext === 'png' ? 'image/png'
        : ext === 'gif' ? 'image/gif'
        : ext === 'webp' ? 'image/webp'
        : 'image/jpeg';
      return new Blob([data], { type: mime });
    };
    const result = archive.rarQueue.then(run);
    archive.rarQueue = result.catch(() => {});
    return result;
  }
}

function buildSpreads(pageCount, enabled) {
  const result = [];
  if (pageCount === 0) return result;
  if (!enabled) {
    for (let i = 0; i < pageCount; i++) result.push([i]);
    return result;
  }
  result.push([0]);
  for (let i = 1; i < pageCount; i += 2) {
    if (i + 1 < pageCount) result.push([i, i + 1]);
    else result.push([i]);
  }
  return result;
}

function spreadIndexForPage(pageNum) {
  for (let i = 0; i < spreads.length; i++) {
    if (spreads[i].includes(pageNum)) return i;
  }
  return 0;
}

async function openComic(file) {
  ++comicLookupRequestId;
  const myRequestId = ++openRequestId;
  statusEl.textContent = 'Opening ' + file.name + '…';
  try {
    const archive = await openArchive(file);
    if (!archive.pageNames.length) throw new Error('This comic contains no readable images.');
    if (myRequestId !== openRequestId) return;

    currentArchive = archive;
    currentFile = file;
    spreads = buildSpreads(archive.pageNames.length, spreadModeEnabled);

    const progress = loadProgress();
    const savedPage = progress[comicKey(file)] || 0;
    currentSpreadIndex = spreadIndexForPage(Math.min(savedPage, archive.pageNames.length - 1));

    libraryScreen.style.display = 'none';
    readerScreen.style.display = 'flex';
    statusEl.textContent = '';
    await showSpread(currentSpreadIndex);
    if (myRequestId === openRequestId) void keepComicForTwoWeeks(file);
  } catch (err) {
    if (myRequestId !== openRequestId) return;
    console.error(err);
    statusEl.textContent = 'Could not open ' + file.name + ': ' + err.message;
  }
}

async function preloadNextSpread(spreadIdx) {
  const nextIdx = spreadIdx + 1;
  if (nextIdx >= spreads.length || !currentArchive) return;
  const pageIndices = spreads[nextIdx];
  const myArchive = currentArchive;
  for (const i of pageIndices) {
    if (!preloadedBlobs[i]) {
      try {
        preloadedBlobs[i] = await getPageBlobFromArchive(myArchive, myArchive.pageNames[i]);
      } catch (err) {
        console.warn('Preload failed for page', i, err);
      }
    }
  }
}

async function showSpread(spreadIdx) {
  if (spreadIdx < 0 || spreadIdx >= spreads.length) return;
  document.getElementById('done-btn').hidden = true;
  currentSpreadIndex = spreadIdx;
  const myArchive = currentArchive;
  const myFile = currentFile;
  const myRequestId = openRequestId;
  const pageIndices = spreads[spreadIdx];

  loadingSpinner.textContent = 'Loading page…';

  const timer = setTimeout(() => {
    if (myRequestId === openRequestId) {
      loadingSpinner.classList.add('visible');
    }
  }, 200);

  try {
    const blobs = [];
    for (const i of pageIndices) {
      if (preloadedBlobs[i]) {
        blobs.push(preloadedBlobs[i]);
        delete preloadedBlobs[i];
      } else {
        blobs.push(await getPageBlobFromArchive(myArchive, myArchive.pageNames[i]));
      }
    }
    if (myRequestId !== openRequestId) {
      clearTimeout(timer);
      return;
    }

    objectURLsInUse.forEach(u => URL.revokeObjectURL(u));
    objectURLsInUse = [];

    const urls = blobs.map(b => URL.createObjectURL(b));
    objectURLsInUse = urls;

    pageImageLeft.src = urls[0];
    pageImageLeft.style.display = 'block';

    if (urls.length > 1) {
      pageImageRight.src = urls[1];
      pageImageRight.style.display = 'block';
      await Promise.all([waitForImageLoad(pageImageLeft), waitForImageLoad(pageImageRight)]);
      if (myRequestId !== openRequestId) {
        clearTimeout(timer);
        return;
      }
      reflowSpread();
    } else {
      pageImageRight.style.display = 'none';
      await waitForImageLoad(pageImageLeft);
      applyStretchCorrection();
    }

    if (myRequestId !== openRequestId) { clearTimeout(timer); return; }
    clearTimeout(timer);
    loadingSpinner.classList.remove('visible');

    const progress = loadProgress();
    progress[comicKey(myFile)] = pageIndices[0];
    saveProgress(progress);
    const history = loadHistory();
    const key = comicKey(myFile);
    history[key] = { ...history[key], title: parseComicTitle(myFile.name), pageCount: myArchive.pageNames.length,
      completed: !!(history[key]?.completed || pageIndices.includes(myArchive.pageNames.length - 1)), lastReadAt: Date.now() };
    saveHistory(history);
    const card = cardsByKey[comicKey(myFile)];
    if (card) addProgressBar(card, comicKey(myFile), myArchive.pageNames.length, progress);
    document.getElementById('done-btn').hidden = spreadIdx !== spreads.length - 1;

    preloadNextSpread(spreadIdx);
  } catch (err) {
    console.error(err);
    clearTimeout(timer);
    loadingSpinner.textContent = 'Error loading page: ' + err.message;
    loadingSpinner.classList.add('visible');
  }
}

function waitForImageLoad(img) {
  return new Promise((resolve) => {
    if (img.complete && img.naturalWidth > 0) { resolve(); return; }
    img.onload = () => resolve();
    img.onerror = () => resolve();
  });
}

const SPREAD_GAP_PX = 12;

function reflowSpread() {
  if (pageImageRight.style.display === 'none') return;
  const w1 = pageImageLeft.naturalWidth, h1 = pageImageLeft.naturalHeight;
  const w2 = pageImageRight.naturalWidth, h2 = pageImageRight.naturalHeight;
  if (!w1 || !h1 || !w2 || !h2) return;

  const containerRect = pageContainer.getBoundingClientRect();
  const containerStyle = getComputedStyle(pageContainer);
  const paddingBottom = parseFloat(containerStyle.paddingBottom) || 0;
  const paddingTop = parseFloat(containerStyle.paddingTop) || 0;
  const cw = containerRect.width - SPREAD_GAP_PX;
  const ch = containerRect.height - paddingBottom - paddingTop;

  const combinedAspectWidthAtHeight1 = (w1 / h1) + (w2 / h2);
  let targetHeight = Math.min(ch, cw / combinedAspectWidthAtHeight1);

  const width1 = targetHeight * (w1 / h1);
  const width2 = targetHeight * (w2 / h2);

  pageImageLeft.style.width = width1 + 'px';
  pageImageLeft.style.height = targetHeight + 'px';
  pageImageRight.style.width = width2 + 'px';
  pageImageRight.style.height = targetHeight + 'px';

  applyStretchCorrection();
}

function downloadHistoryFile(file) {

  const link = document.createElement('a');
  link.href = url;
  link.download = file.name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  statusEl.textContent = 'Backup requested. If a preview opens, choose Share → Save to Files → On My iPad.';
}
async function saveHistoryBackup() {
  const data = { app: 'usb-comic-reader', version: 1, savedAt: new Date().toISOString(), progress: loadProgress(), comics: loadHistory(), settings: { spreadMode: loadSpreadMode(), stretchCorrections: loadStretchCorrections() } };
  const file = new File([JSON.stringify(data, null, 2)], 'comic-history.json', { type: 'application/json' });
  let canShareFile = false;
  try { canShareFile = !!(navigator.share && navigator.canShare?.({ files: [file] })); } catch { /* Use the download fallback. */ }
  if (canShareFile) {
    try {
      // Call before any await so iPad Safari retains the Done tap's user activation.
      await navigator.share({ files: [file], title: 'Comic reading history' });
      statusEl.textContent = 'Reading progress saved. A backup file is kept only if you chose Save to Files.';
      return;
    } catch (error) {
      if (error.name === 'AbortError') {

async function restoreHistoryFromInput(event) {
  try {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) throw new Error('Backup is too large.');
    const data = JSON.parse(await file.text());
    const isMap = value => value && typeof value === 'object' && !Array.isArray(value);
    const safeKey = key => !['__proto__', 'constructor', 'prototype'].includes(key);
    if (data.app !== 'usb-comic-reader' || data.version !== 1 || !isMap(data.progress) || !isMap(data.comics)) throw new Error('Choose a Comic Reader history backup.');
    for (const [key, page] of Object.entries(data.progress)) {
      if (!safeKey(key) || !Number.isSafeInteger(page) || page < 0) throw new Error('Invalid reading progress.');
    }
    for (const [key, comic] of Object.entries(data.comics)) {
      if (!safeKey(key) || !isMap(comic) || typeof comic.title !== 'string' || !Number.isSafeInteger(comic.pageCount) || comic.pageCount < 1 || (comic.completed !== undefined && typeof comic.completed !== 'boolean') || (comic.lastReadAt !== undefined && (!Number.isSafeInteger(comic.lastReadAt) || comic.lastReadAt < 0))) throw new Error('Invalid comic history.');
    }
    if (data.settings !== undefined) {
      if (!isMap(data.settings) || (data.settings.spreadMode !== undefined && typeof data.settings.spreadMode !== 'boolean')) throw new Error('Invalid reading settings.');
      if (data.settings.stretchCorrections !== undefined) {
        if (!isMap(data.settings.stretchCorrections)) throw new Error('Invalid image settings.');
        for (const [key, value] of Object.entries(data.settings.stretchCorrections)) {
          if (!safeKey(key) || !isMap(value) || !Number.isFinite(value.scaleX) || !Number.isFinite(value.scaleY) || value.scaleX < 0.7 || value.scaleX > 1.3 || value.scaleY < 0.7 || value.scaleY > 1.3) throw new Error('Invalid image settings.');
        }
      }
    }
    const progress = loadProgress();
    const history = loadHistory();
    for (const [key, page] of Object.entries(data.progress)) progress[key] = Math.max(progress[key] || 0, page);
    for (const [key, comic] of Object.entries(data.comics)) {
      history[key] = { title: comic.title, pageCount: comic.pageCount, completed: !!(history[key]?.completed || comic.completed), lastReadAt: Math.max(history[key]?.lastReadAt || 0, comic.lastReadAt || 0) };
    }
    saveProgress(progress);
    saveHistory(history);
    if (data.settings?.spreadMode !== undefined) {
      spreadModeEnabled = data.settings.spreadMode;
      saveSpreadMode(spreadModeEnabled);
      updateSpreadToggleUI();
    }
    if (data.settings?.stretchCorrections) {
      const corrections = loadStretchCorrections();
      for (const [key, value] of Object.entries(data.settings.stretchCorrections)) corrections[canonicalComicKey(key)] = { scaleX: value.scaleX, scaleY: value.scaleY };
      saveStretchCorrections(corrections);
    }
    renderHistoryCards();
    refreshLibrary();
    statusEl.textContent = 'History restored. Newer saved progress was kept. Choose the original comic files if they are not saved on this iPad.';
    if (event.target.id === 'startup-history-input') document.getElementById('startup-dialog').close();
  } catch (error) {
    statusEl.textContent = 'Could not restore history: ' + error.message;
    if (event.target.id === 'startup-history-input') document.getElementById('startup-message').textContent = statusEl.textContent;
  } finally { event.target.value = ''; }
}

  for (const [key, comic] of Object.entries(history)) {

function isCatalogKey(key) { return /^archie:\d+$/.test(key) && catalogIssues.has(Number(key.slice(7))); }
function hiddenCatalogKeys() {
  try { const value = JSON.parse(localStorage.getItem(CATALOG_HIDDEN_KEY)); return Array.isArray(value) ? value : []; } catch { return []; }
}
function setCatalogHidden(key, hidden) {
  const keys = new Set(hiddenCatalogKeys());
  if (hidden) keys.add(key); else keys.delete(key);
  localStorage.setItem(CATALOG_HIDDEN_KEY, JSON.stringify([...keys]));
}
function addCardSelectionMark(cover) {
  if (cover.querySelector('.selection-checkmark')) return;
  const check = document.createElement('div');
  check.className = 'selection-checkmark'; check.textContent = '✓'; cover.appendChild(check);
}
function renderCatalog() {
  const hidden = new Set(hiddenCatalogKeys());
  for (const issue of catalogIssues) {
    const key = `archie:${issue}`;
    if (cardsByKey[key] || hidden.has(key)) continue;
    const card = buildCard(`Archie ${issue}`, key);
    const cover = card.querySelector('.comic-cover');
    const img = document.createElement('img');
    img.src = `covers/archie-${issue}.jpg?v=original`;
    img.alt = `Archie ${issue} cover`;
    img.loading = 'lazy'; img.decoding = 'async';
    cover.replaceChildren(img); addCardSelectionMark(cover);
    card.addEventListener('click', () => onCardClick(key, card));
    cardsByKey[key] = card;
  }
}
function migrateReadingHistory() {
  const oldProgress = loadProgress();
  const oldHistory = loadHistory();
  const progress = {};
  const history = {};
  for (const [key, value] of Object.entries(oldProgress)) {
    const target = canonicalComicKey(key, oldHistory[key]?.title);
    progress[target] = Math.max(progress[target] ?? 0, value);
  }
  for (const [key, entry] of Object.entries(oldHistory)) {
    const target = canonicalComicKey(key, entry.title);
    const previous = history[target];
    history[target] = { ...entry, completed: !!(previous?.completed || entry.completed), lastReadAt: Math.max(previous?.lastReadAt || 0, entry.lastReadAt || 0), pageCount: Math.max(previous?.pageCount || 0, entry.pageCount || 0) };
  }
  saveProgress(progress);
  saveHistory(history);
}
function showLibraryView(view) {
  if (selectionMode) exitSelectionMode();
  libraryView = view;
  document.getElementById('comic-search').value = '';
  document.getElementById('library-home-btn').setAttribute('aria-pressed', String(view === 'home'));
  document.getElementById('library-recent-btn').setAttribute('aria-pressed', String(view === 'recent'));
  refreshLibrary();
  libraryScreen.scrollTop = 0;
}
document.getElementById('library-home-btn').addEventListener('click', () => showLibraryView('home'));
document.getElementById('library-recent-btn').addEventListener('click', () => showLibraryView('recent'));
document.getElementById('comic-search').addEventListener('input', refreshLibrary);
fileInput.addEventListener('cancel', () => { pendingOpenKey = null; statusEl.textContent = ''; document.getElementById('choose-comic-file').hidden = true; });
// Archive copies expire independently of covers and reading history. No count cap.
const COMIC_CACHE_DURATION = 14 * 24 * 60 * 60 * 1000;
const cachedComicExpiries = new Map();
const savedComicFiles = new WeakSet();
function showComicCacheWarning(error) {
  const message = error?.name === 'QuotaExceededError'
    ? 'There is not enough space to keep this comic on your iPad. You can keep reading; choose its file again next time.'
    : error?.message?.startsWith('Close other Comic Reader') ? error.message
    : 'This comic could not be saved on your iPad. You can keep reading; choose its file again next time.';
  document.getElementById('cache-notice-text').textContent = message;
  document.getElementById('cache-notice').hidden = false;
}
document.getElementById('cache-notice-close').addEventListener('click', () => { document.getElementById('cache-notice').hidden = true; });
async function refreshComicCache() {
  const db = await getDB();
  const now = Date.now();
  const metadata = await new Promise((resolve, reject) => {
    const tx = db.transaction(['comics', 'comicCacheMetadata'], 'readwrite');
    const store = tx.objectStore('comicCacheMetadata');
    const expired = store.index('expiresAt').openCursor(IDBKeyRange.upperBound(now));
    expired.onsuccess = () => {
      const cursor = expired.result;
      if (!cursor) return;
      tx.objectStore('comics').delete(cursor.primaryKey);
      cursor.delete();
      cursor.continue();
    };
    const request = store.getAll();
    let entries = [];
    request.onsuccess = () => { entries = request.result; };
    tx.oncomplete = () => resolve(entries.filter(entry => entry.expiresAt > now));
    tx.onabort = () => reject(tx.error || new Error('Temporary storage unavailable.'));
    tx.onerror = () => reject(tx.error);
  });
  for (const [key, expiry] of cachedComicExpiries) { if (expiry <= now) cachedComicExpiries.delete(key); }
  metadata.forEach(entry => cachedComicExpiries.set(entry.key, Math.max(entry.expiresAt, cachedComicExpiries.get(entry.key) || 0)));
}
async function keepComicForTwoWeeks(file) {
  try {
    await refreshComicCache();
    const db = await getDB();
    const key = comicKey(file);
    const now = Date.now();
    const expiresAt = now + COMIC_CACHE_DURATION;
    const alreadySaved = savedComicFiles.has(file) && cachedComicExpiries.has(key);
    await new Promise((resolve, reject) => {
      const tx = db.transaction(['comics', 'comicCacheMetadata'], 'readwrite');
      if (!alreadySaved) tx.objectStore('comics').put({ key, blob: file, name: file.name, type: file.type, lastModified: file.lastModified });
      tx.objectStore('comicCacheMetadata').put({ key, lastOpenedAt: now, expiresAt });
      tx.oncomplete = resolve;
      tx.onabort = () => reject(tx.error || new Error('Temporary storage unavailable.'));
      tx.onerror = () => reject(tx.error);
    });
    savedComicFiles.add(file);
    cachedComicExpiries.set(key, expiresAt);
  } catch (error) { showComicCacheWarning(error); }
}
async function readCachedComic(key) {
  const db = await getDB();
  const result = await new Promise((resolve, reject) => {
    const tx = db.transaction(['comics', 'comicCacheMetadata'], 'readwrite');
    const metadata = tx.objectStore('comicCacheMetadata');
    const comics = tx.objectStore('comics');
    const request = metadata.get(key);
    let entry = null;
    request.onsuccess = () => {
      if (!request.result || request.result.expiresAt <= Date.now()) {
        metadata.delete(key); comics.delete(key); return;
      }
      const archive = comics.get(key);
      archive.onsuccess = () => { entry = archive.result || null; };
    };
    tx.oncomplete = () => resolve(entry);
    tx.onabort = () => reject(tx.error || new Error('Temporary storage unavailable.'));
    tx.onerror = () => reject(tx.error);
  });
  if (!result) { cachedComicExpiries.delete(key); return null; }
  const file = new File([result.blob], result.name, { type: result.type, lastModified: result.lastModified });
  savedComicFiles.add(file);
  return file;
}
// A closed website cannot run timers; expired copies are also pruned on startup.
setInterval(() => { if (libraryBooted) void refreshComicCache().catch(() => {}); }, 15 * 60 * 1000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && libraryBooted) void refreshComicCache().catch(() => {});
});

let libraryBooted = false;
async function bootApp() {
  if (libraryBooted) return;
  libraryBooted = true;
  try {
    try { await refreshComicCache(); } catch (error) { showComicCacheWarning(error); }
    migrateReadingHistory();
    renderHistoryCards();
    await renderCachedLibrary();
    renderHistoryCards();
    showStartupHistoryStatus();
  } catch (error) {
    console.error(error);
    statusEl.textContent = 'Could not load the library: ' + error.message;
  }
}

if (localStorage.getItem(GATE_UNLOCK_KEY) === GATE_UNLOCK_VERSION) {
  bootApp();
}
</script>
